<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Clickz RIS — UI Kit</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="mock.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Reception.jsx"></script>
<script type="text/babel" src="Worklist.jsx"></script>
<script type="text/babel" src="Billing.jsx"></script>
<script type="text/babel" src="Commission.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp } = React;

// Which roles can see which routes (from the brief's role expectations).
const ROUTE_ROLES = {
  dashboard:  ['admin','super_admin','receptionist','doctor'],
  reception:  ['admin','super_admin','receptionist','doctor'],
  worklist:   ['admin','super_admin','receptionist','doctor'],
  billing:    ['admin','super_admin','receptionist'],
  commission: ['admin','super_admin'],
  settings:   ['admin','super_admin'],
};
const USER_BY_ROLE = {
  admin:        { name:'Dr. Neha Shah',  role:'admin' },
  doctor:       { name:'Dr. Arvind Rao', role:'doctor' },
  receptionist: { name:'Kavya Menon',    role:'receptionist' },
};

function App() {
  const [authed, setAuthed] = useStateApp(false);
  const [user, setUser] = useStateApp(USER_BY_ROLE.admin);
  const [route, setRoute] = useStateApp('dashboard');
  const [theme, setTheme] = useStateApp('light');

  useEffectApp(() => {
    const r = document.documentElement;
    if (theme === 'dark') r.classList.add('dark'); else r.classList.remove('dark');
  }, [theme]);

  // re-render lucide icons whenever the route changes
  useEffectApp(() => { if (window.lucide) window.lucide.createIcons(); });

  const login = (role) => {
    setUser(USER_BY_ROLE[role] || USER_BY_ROLE.admin);
    const allowed = Object.keys(ROUTE_ROLES).find((rt) => ROUTE_ROLES[rt].includes(role)) || 'dashboard';
    setRoute(ROUTE_ROLES.dashboard.includes(role) ? 'dashboard' : allowed);
    setAuthed(true);
  };

  if (!authed) return <LoginScreen onLogin={login} />;

  const role = user.role;
  const can = (rt) => ROUTE_ROLES[rt].includes(role);
  const current = can(route) ? route : 'dashboard';

  const Screen = {
    dashboard:  <Dashboard role={role} onNav={setRoute} />,
    reception:  <Reception role={role} onNav={setRoute} />,
    worklist:   <Worklist role={role} onNav={setRoute} />,
    billing:    <Billing role={role} />,
    commission: <Commission role={role} />,
    settings:   <Settings role={role} />,
  }[current];

  return (
    <div className="app">
      <Sidebar route={current} onNav={(rt) => can(rt) && setRoute(rt)} user={user} can={can} />
      <div className="main">
        <Topbar route={current} theme={theme} onToggleTheme={() => setTheme((t) => t === 'dark' ? 'light' : 'dark')} onLogout={() => setAuthed(false)} />
        <div className="content">{Screen}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider><App /></ToastProvider>
);
</script>
</body>
</html>
