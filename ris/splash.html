<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>One Clickz RIS</title>
<style>
  html,body{margin:0;height:100%;background:#ffffff;color:#171717;font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
  .title{color:#dc2626;font-size:1.6rem;font-weight:800;letter-spacing:.3px}
  .sub{color:#737373;font-size:0.9rem}
  .spinner{width:34px;height:34px;border:3px solid #eee;border-top-color:#dc2626;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body>
  <div class="spinner"></div>
  <div class="title">One Clickz RIS</div>
  <div class="sub">Starting up…</div>
</body></html>
